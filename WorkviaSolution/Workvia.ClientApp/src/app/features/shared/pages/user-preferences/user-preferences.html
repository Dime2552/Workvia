<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <!-- Settings Groups -->
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 text-primary"><i class="bi bi-shield-lock me-2"></i>Security</h5>
        </div>
        
        <div class="card-body p-0">
          <!-- Password Item -->
          <div class="settings-item p-3 border-bottom d-flex justify-content-between align-items-center">
            <div>
              <h6 class="mb-1">Password</h6>
              <small class="text-muted">Change your account password.</small>
            </div>
            <button class="btn btn-outline-secondary btn-sm" (click)="openChangePasswordModal()">
              Change Password
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
